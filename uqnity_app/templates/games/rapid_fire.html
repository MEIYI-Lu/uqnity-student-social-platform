{% extends "base.html" %}

{% block content %}
<style>
    .game-container { min-height: 100vh; padding: 2rem 1rem; }
    .game-header { max-width: 900px; margin: 0 auto 2rem; display: flex; align-items: center; gap: 1rem; }
    .back-btn { padding: 0.5rem; background: white; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .back-btn:hover { background: #f7fafc; }
    .game-title-section { flex: 1; }
    .game-title-section h1 { font-size: 2rem; margin: 0 0 0.25rem 0; }
    .game-subtitle { color: #718096; margin: 0; }
    .game-card { max-width: 900px; margin: 0 auto; background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
    .card-header h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    .card-description { color: #718096; margin-bottom: 1.5rem; }
    .player-count-selector { margin-bottom: 2rem; }
    .player-count-selector label { display: block; font-weight: 500; margin-bottom: 0.5rem; }
    .count-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .count-btn { width: 3rem; height: 3rem; border: 2px solid #e2e8f0; background: white; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .count-btn:hover { border-color: #9A6EAB; }
    .count-btn.active { background: #9A6EAB; color: white; border-color: #9A6EAB; }
    .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.5rem; margin-bottom: 2rem; }
    .player-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; background: #f7fafc; border-radius: 8px; }
    .player-avatar { font-size: 1.25rem; }
    .how-to-play { background: #FFF4E6; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
    .how-to-play h3 { font-weight: 600; margin-bottom: 0.75rem; }
    .how-to-play ul { list-style: none; padding: 0; margin: 0; font-size: 0.875rem; color: #4A5568; }
    .how-to-play li { margin-bottom: 0.25rem; }
    .start-btn { width: 100%; padding: 1rem; background: #9A6EAB; color: white; border: none; border-radius: 8px; font-weight: 500; font-size: 1.125rem; cursor: pointer; transition: all 0.3s; }
    .start-btn:hover { background: #744F82; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(154, 110, 171, 0.3); }
    .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin: 0.5rem 0; }
    .progress-fill { height: 100%; background: #9A6EAB; transition: width 0.3s; }
    .statement-input { width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px; margin-top: 0.5rem; font-size: 1rem; transition: border-color 0.2s; }
    .statement-input:focus { outline: none; border-color: #9A6EAB; }
    .result-item { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; }
    .rank-1 { background: linear-gradient(135deg, #FFF9E6 0%, #FFE5B4 100%); border: 2px solid #FFD700; }
    .rank-2 { background: linear-gradient(135deg, #F5F5F5 0%, #E8E8E8 100%); border: 2px solid #C0C0C0; }
    .rank-3 { background: linear-gradient(135deg, #FFF0E6 0%, #FFD4B4 100%); border: 2px solid #CD7F32; }
    .badge { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.875rem; font-weight: 500; }
    .badge-primary { background: #9A6EAB; color: white; }
    .badge-secondary { background: #e2e8f0; color: #4A5568; }
</style>

<div class="game-container">
    <div id="app"></div>
</div>

<script>
    const user = {{ user | tojson }};
    let gamePhase = 'setup';
    let playerCount = 4;
    let questionsPerRound = 5;
    let timeLimit = 10;
    let currentQuestion = 0;
    let timeLeft = timeLimit;
    let userAnswer = '';
    let answers = [];
    let allAnswers = [];
    let scores = {};
    let questions = [];
    let timerInterval = null;

    const mockPlayers = [
        { name: user.name, avatar: user.avatar },
        { name: 'Sarah', avatar: '🌟' },
        { name: 'Mike', avatar: '🎯' },
        { name: 'Emma', avatar: '🎨' },
        { name: 'Jake', avatar: '⚡' },
        { name: 'Lily', avatar: '🌸' },
        { name: 'Tom', avatar: '🎪' },
        { name: 'Zoe', avatar: '🦋' }
    ];

    function getPlayers() {
        return mockPlayers.slice(0, playerCount);
    }

    async function startGame() {
        console.log('🎮 Starting game...');
        try {
            const response = await fetch('/api/rapid-fire/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playerCount, questionsPerRound, timeLimit })
            });
            
            if (!response.ok) {
                throw new Error('Failed to start game');
            }
            
            const data = await response.json();
            console.log('✅ Game started:', data);
            
            questions = data.questions;
            scores = data.scores;
            currentQuestion = 0;
            allAnswers = [];
            gamePhase = 'playing';
            timeLeft = timeLimit;
            userAnswer = '';
            answers = [];
            
            startTimer();
            render();
        } catch (error) {
            console.error('❌ Error starting game:', error);
            alert('Failed to start game. Please check console for details.');
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (gamePhase === 'playing' && timeLeft > 0) {
                timeLeft--;
                render();
            } else if (gamePhase === 'playing' && timeLeft === 0) {
                handleTimeUp();
            }
        }, 1000);
    }

    function handleTimeUp() {
        submitAnswer();
    }

    async function submitAnswer() {
        if (timerInterval) clearInterval(timerInterval);
        
        const timeToAnswer = timeLimit - timeLeft;
        const response = await fetch('/api/rapid-fire/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answer: userAnswer, timeToAnswer })
        });
        const data = await response.json();
        
        answers = data.answers;
        scores = data.scores;
        
        allAnswers.push({ question: questions[currentQuestion], answers: data.answers });
        
        render();
        
        setTimeout(() => {
            if (currentQuestion < questionsPerRound - 1) {
                currentQuestion++;
                timeLeft = timeLimit;
                userAnswer = '';
                answers = [];
                gamePhase = 'playing';
                startTimer();
                render();
            } else {
                gamePhase = 'final';
                render();
            }
        }, 0);
    }

    function resetGame() {
        gamePhase = 'setup';
        currentQuestion = 0;
        timeLeft = timeLimit;
        userAnswer = '';
        answers = [];
        allAnswers = [];
        scores = {};
        if (timerInterval) clearInterval(timerInterval);
        render();
    }

    function render() {
        const app = document.getElementById('app');
        
        if (gamePhase === 'setup') {
            app.innerHTML = renderSetup();
        } else if (gamePhase === 'playing') {
            app.innerHTML = renderPlaying();
        } else if (gamePhase === 'final') {
            app.innerHTML = renderFinal();
        }
        
        attachEventListeners();
    }

    function renderSetup() {
        const players = getPlayers();
        return `
            <div class="game-header">
                <button onclick="window.location.href='{{ url_for('main.game_menu') }}'" class="back-btn">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                </button>
                <div class="game-title-section">
                    <h1>⚡ Rapid Fire</h1>
                    <p class="game-subtitle">Quick questions, fast answers!</p>
                </div>
            </div>

            <div class="game-card">
                <div class="card-header">
                    <h2>Game Setup</h2>
                    <p class="card-description">Configure your Rapid Fire session</p>
                </div>

                <div class="player-count-selector">
                    <label>Number of Players</label>
                    <div class="count-buttons">
                        ${[2,3,4,5,6,7,8].map(c => `
                            <button onclick="playerCount=${c}; render()" class="count-btn ${playerCount === c ? 'active' : ''}">
                                ${c}
                            </button>
                        `).join('')}
                    </div>
                </div>

                <div class="player-count-selector">
                    <label>Questions Per Round</label>
                    <div class="count-buttons">
                        ${[5,10,15,20].map(c => `
                            <button onclick="questionsPerRound=${c}; render()" class="count-btn ${questionsPerRound === c ? 'active' : ''}" style="width: auto; padding: 0 1.5rem;">
                                ${c}
                            </button>
                        `).join('')}
                    </div>
                </div>

                <div class="player-count-selector">
                    <label>Time Limit (seconds per question)</label>
                    <div class="count-buttons">
                        ${[5,10,15,20].map(t => `
                            <button onclick="timeLimit=${t}; timeLeft=${t}; render()" class="count-btn ${timeLimit === t ? 'active' : ''}" style="width: auto; padding: 0 1.5rem;">
                                ${t}s
                            </button>
                        `).join('')}
                    </div>
                </div>

                <div class="player-count-selector">
                    <label>Players</label>
                    <div class="players-grid">
                        ${players.map(p => `
                            <div class="player-item">
                                <span class="player-avatar">${p.avatar}</span>
                                <span>${p.name}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="how-to-play">
                    <h3>How to Play:</h3>
                    <ul>
                        <li>• Answer questions as fast as you can</li>
                        <li>• Faster answers = more points</li>
                        <li>• No wrong answers, just have fun!</li>
                        <li>• Get to know each other quickly</li>
                    </ul>
                </div>

                <button onclick="startGame()" class="start-btn">Start Rapid Fire ⚡</button>
            </div>
        `;
    }

    function renderPlaying() {
        const currentQ = questions[currentQuestion];
        const progress = ((currentQuestion + 1) / questionsPerRound) * 100;
        const timeProgress = (timeLeft / timeLimit) * 100;
        const hasSubmitted = answers.length > 0;

        return `
            <div class="game-header">
                <button onclick="resetGame()" class="back-btn">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                </button>
                <div class="game-title-section">
                    <h1>⚡ Rapid Fire</h1>
                    <p class="game-subtitle">Question ${currentQuestion + 1} of ${questionsPerRound}</p>
                </div>
                <div style="text-align: right;">
                    <p style="font-size: 0.875rem; color: #718096; margin: 0;">Time Left</p>
                    <p style="font-size: 2rem; font-weight: 600; margin: 0;">${timeLeft}s</p>
                </div>
            </div>

            <div class="progress-bar" style="max-width: 900px; margin: 0 auto 2rem;">
                <div class="progress-fill" style="width: ${progress}%"></div>
            </div>

            ${!hasSubmitted ? `
                <div class="game-card">
                    <div style="text-align: center; margin-bottom: 1.5rem;">
                        <span class="badge badge-primary">${currentQ.category}</span>
                        <h1 style="font-size: 2.5rem; margin: 1rem 0;">${currentQ.question}</h1>
                    </div>
                    <form onsubmit="event.preventDefault(); if(userAnswer.trim()) submitAnswer();">
                        <input type="text" 
                               id="answerInput"
                               value="${userAnswer}"
                               oninput="userAnswer=this.value"
                               class="statement-input"
                               style="font-size: 1.25rem; padding: 1.5rem;"
                               placeholder="Type your answer..."
                               maxlength="50"
                               autofocus>
                        <div class="progress-bar" style="margin: 1rem 0;">
                            <div class="progress-fill" style="width: ${timeProgress}%; background: #48BB78;"></div>
                        </div>
                        <button type="submit" class="start-btn" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            </svg>
                            Submit Answer
                        </button>
                        <p style="text-align: center; color: #718096; margin-top: 1rem; font-size: 0.875rem;">Press Enter to submit quickly!</p>
                    </form>
                </div>
            ` : `
                <div class="game-card">
                    <h2 style="margin-bottom: 0.5rem;">Everyone's Answers</h2>
                    <p style="color: #718096; margin-bottom: 1.5rem;">See what others said!</p>
                    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                        ${answers.map(answer => `
                            <div style="display: flex; align-items: center; justify-content: space-between; padding: 1rem; background: #f7fafc; border-radius: 8px;">
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <span style="font-size: 2rem;">${answer.avatar}</span>
                                    <div>
                                        <p style="font-weight: 600; margin: 0;">${answer.playerName}</p>
                                        <p style="color: #4A5568; margin: 0;">${answer.answer}</p>
                                    </div>
                                </div>
                                <span class="badge badge-primary">${answer.timeToAnswer}s</span>
                            </div>
                        `).join('')}
                    </div>
                    <p style="text-align: center; color: #718096; margin-top: 1rem;">Next question coming up...</p>
                </div>
            `}
        `;
    }

    function renderFinal() {
        const players = getPlayers();
        const sortedPlayers = players.sort((a, b) => (scores[b.name] || 0) - (scores[a.name] || 0));
        const winner = sortedPlayers[0];

        return `
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="font-size: 4rem; margin-bottom: 1rem;">🏆</div>
                <h1>Game Over!</h1>
                <p class="game-subtitle">Lightning-fast answers complete!</p>
            </div>

            <div class="game-card rank-1" style="text-align: center; margin-bottom: 1.5rem;">
                <p style="font-weight: 600; margin-bottom: 0.75rem;">⚡ Speed Champion</p>
                <p style="font-size: 4rem; margin: 0;">${winner.avatar}</p>
                <h2 style="margin: 0.5rem 0;">${winner.name}</h2>
                <p style="font-size: 2rem; font-weight: 600; margin: 0;">${scores[winner.name]} points</p>
            </div>

            <div class="game-card" style="margin-bottom: 1.5rem;">
                <h2 style="margin-bottom: 1rem;">Final Scores</h2>
                ${sortedPlayers.map((player, idx) => `
                    <div class="result-item ${idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : ''}" style="background: ${idx > 2 ? '#f7fafc' : ''};">
                        <span class="badge badge-secondary">#${idx + 1}</span>
                        <span style="font-size: 2rem;">${player.avatar}</span>
                        <span style="flex: 1; font-weight: 500;">${player.name}</span>
                        <span style="font-size: 1.25rem; font-weight: 600;">${scores[player.name]} pts</span>
                    </div>
                `).join('')}
            </div>

            <div class="game-card" style="margin-bottom: 1.5rem;">
                <h2 style="margin-bottom: 1rem;">Memorable Answers</h2>
                ${allAnswers.slice(0, 3).map(round => `
                    <div style="border-left: 4px solid #9A6EAB; padding-left: 1rem; margin-bottom: 1rem;">
                        <p style="font-weight: 600; margin-bottom: 0.5rem;">${round.question.question}</p>
                        ${round.answers.slice(0, 2).map(answer => `
                            <p style="font-size: 0.875rem; color: #4A5568; margin: 0.25rem 0;">${answer.avatar} ${answer.playerName}: "${answer.answer}"</p>
                        `).join('')}
                    </div>
                `).join('')}
            </div>

            <div style="display: flex; gap: 0.75rem; max-width: 900px; margin: 0 auto; align-items: center;">
    <button onclick="resetGame(); startGame()" class="start-btn" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Play Again
    </button>
    <button onclick="window.location.href='{{ url_for('main.game_menu') }}'" class="back-btn" style="padding: 1rem;">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
    </button>
</div>
        `;
    }

    function attachEventListeners() {
        const input = document.getElementById('answerInput');
        if (input) {
            input.focus();
        }
    }

    // Initial render
    render();
</script>
{% endblock content %}
